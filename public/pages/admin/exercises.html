<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercises Management — NutriTrack Admin</title>
  <meta name="description" content="NutriTrack admin — manage exercise library." />
  <link rel="shortcut icon" href="../../assest/images/Nutricion-icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assest/css/main.css" />
  <link rel="stylesheet" href="../../assest/css/admin.css" />
  <script src="../../assest/js/theme.js"></script>
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__brand">
      <img src="../../assest/images/Nutricion-icon.png" alt="NutriTrack" class="admin-sidebar__logo" />
      <span class="admin-sidebar__name">NutriTrack</span>
      <span class="admin-sidebar__badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__item" id="nav-dashboard">
        <span class="material-symbols-outlined">dashboard</span><span>Dashboard</span>
      </a>
      <a href="users.html" class="admin-nav__item" id="nav-users">
        <span class="material-symbols-outlined">group</span><span>Users</span>
      </a>
      <a href="meals.html" class="admin-nav__item" id="nav-meals">
        <span class="material-symbols-outlined">restaurant</span><span>Meals</span>
      </a>
      <a href="exercises.html" class="admin-nav__item active" id="nav-exercises">
        <span class="material-symbols-outlined">fitness_center</span><span>Exercises</span>
      </a>
      <a href="advice.html" class="admin-nav__item" id="nav-advice">
        <span class="material-symbols-outlined">lightbulb</span><span>Health Advice</span>
      </a>
      <a href="reports.html" class="admin-nav__item" id="nav-reports">
        <span class="material-symbols-outlined">bar_chart</span><span>Reports</span>
      </a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="../../index.html" class="admin-nav__item admin-nav__item--logout" data-auth-logout>
        <span class="material-symbols-outlined">logout</span><span>Logout</span>
      </a>
    </div>
  </aside>

  <header class="admin-topbar" id="admin-topbar">
    <button class="admin-topbar__toggle" id="sidebar-toggle" aria-label="Toggle menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="admin-topbar__title">Exercises Management</span>
    <div class="admin-topbar__actions">
      <div class="admin-topbar__user" id="topbar-user">Admin</div>
      <button type="button" class="admin-theme-btn theme-toggle-btn" title="Switch to Light Mode">
        <span class="material-symbols-outlined theme-icon">light_mode</span>
      </button>
    </div>
  </header>

  <main class="admin-main" id="admin-main">

    <div class="admin-page-header">
      <h1 class="admin-page-title">Exercises Management</h1>
      <button class="admin-btn admin-btn--primary" id="add-exercise-btn">
        <span class="material-symbols-outlined">add</span> Add Exercise
      </button>
    </div>

    <!-- Search & Filter -->
    <div class="admin-toolbar">
      <div class="admin-search-wrap">
        <span class="material-symbols-outlined admin-search-icon">search</span>
        <input type="text" id="exercise-search" class="admin-search" placeholder="Search exercises…" />
      </div>
      <select id="exercise-diff-filter" class="admin-select">
        <option value="">All Difficulties</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <!-- Exercises Table -->
    <div class="admin-table-wrap">
      <table class="admin-table" id="exercises-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Muscle Group</th>
            <th>Duration</th>
            <th>Calories Burned</th>
            <th>Difficulty</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="exercises-body">
          <tr><td colspan="6" class="admin-table__empty">Loading exercises…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="admin-pagination" id="exercises-pagination"></div>

    <!-- Add / Edit Exercise Modal -->
    <div class="admin-modal-overlay" id="exercise-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="exercise-modal-title">
      <div class="admin-modal">
        <div class="admin-modal__header">
          <h2 class="admin-modal__title" id="exercise-modal-title">Add Exercise</h2>
          <button class="admin-modal__close" id="close-exercise-modal" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <form id="exercise-form" class="admin-form" novalidate>
          <input type="hidden" id="exercise-id" />
          <div class="admin-form__grid">
            <div class="admin-form__group admin-form__group--full">
              <label for="exercise-name">Exercise Name *</label>
              <input type="text" id="exercise-name" class="admin-input" required placeholder="e.g. Push-ups" />
            </div>
            <div class="admin-form__group admin-form__group--full">
              <label for="exercise-description">Description</label>
              <textarea id="exercise-description" class="admin-input admin-textarea" rows="3" placeholder="Brief description…"></textarea>
            </div>
            <div class="admin-form__group">
              <label for="exercise-difficulty">Difficulty *</label>
              <select id="exercise-difficulty" class="admin-select" required>
                <option value="">— Select —</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <div class="admin-form__group">
              <label for="exercise-muscle">Muscle Group</label>
              <input type="text" id="exercise-muscle" class="admin-input" placeholder="e.g. Chest, Arms…" />
            </div>
            <div class="admin-form__group">
              <label for="exercise-duration">Duration (minutes) *</label>
              <input type="number" id="exercise-duration" class="admin-input" required min="1" placeholder="30" />
            </div>
            <div class="admin-form__group">
              <label for="exercise-calories">Calories Burned *</label>
              <input type="number" id="exercise-calories" class="admin-input" required min="0" step="0.1" placeholder="0" />
            </div>
          </div>
          <div id="exercise-form-error" class="admin-form__error" style="display:none"></div>
          <div class="admin-form__actions">
            <button type="button" class="admin-btn admin-btn--ghost" id="cancel-exercise">Cancel</button>
            <button type="submit" class="admin-btn admin-btn--primary" id="save-exercise-btn">
              <span class="material-symbols-outlined">save</span> Save Exercise
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="admin-loading-overlay" id="page-loading" style="display:none">
      <div class="admin-spinner"></div>
    </div>
    <div class="admin-toast" id="admin-toast"></div>
  </main>

  <script src="../../assest/js/auth-backend-config.js"></script>
  <script src="../../assest/js/api-client.js"></script>
  <script src="../../assest/js/auth.js"></script>
  <script src="../../assest/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      AdminPanel.init('exercises');
      AdminPanel.loadExercises();
    });
  </script>
</body>
</html>
