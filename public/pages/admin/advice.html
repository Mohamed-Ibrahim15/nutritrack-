<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Advice — NutriTrack Admin</title>
  <meta name="description" content="NutriTrack admin — manage health advice articles." />
  <link rel="shortcut icon" href="../../assest/images/Nutricion-icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assest/css/main.css" />
  <link rel="stylesheet" href="../../assest/css/admin.css" />
  <script src="../../assest/js/theme.js"></script>
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__brand">
      <img src="../../assest/images/Nutricion-icon.png" alt="NutriTrack" class="admin-sidebar__logo" />
      <span class="admin-sidebar__name">NutriTrack</span>
      <span class="admin-sidebar__badge">Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__item" id="nav-dashboard">
        <span class="material-symbols-outlined">dashboard</span><span>Dashboard</span>
      </a>
      <a href="users.html" class="admin-nav__item" id="nav-users">
        <span class="material-symbols-outlined">group</span><span>Users</span>
      </a>
      <a href="meals.html" class="admin-nav__item" id="nav-meals">
        <span class="material-symbols-outlined">restaurant</span><span>Meals</span>
      </a>
      <a href="exercises.html" class="admin-nav__item" id="nav-exercises">
        <span class="material-symbols-outlined">fitness_center</span><span>Exercises</span>
      </a>
      <a href="advice.html" class="admin-nav__item active" id="nav-advice">
        <span class="material-symbols-outlined">lightbulb</span><span>Health Advice</span>
      </a>
      <a href="reports.html" class="admin-nav__item" id="nav-reports">
        <span class="material-symbols-outlined">bar_chart</span><span>Reports</span>
      </a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="../../index.html" class="admin-nav__item admin-nav__item--logout" data-auth-logout>
        <span class="material-symbols-outlined">logout</span><span>Logout</span>
      </a>
    </div>
  </aside>

  <header class="admin-topbar" id="admin-topbar">
    <button class="admin-topbar__toggle" id="sidebar-toggle" aria-label="Toggle menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="admin-topbar__title">Health Advice</span>
    <div class="admin-topbar__actions">
      <div class="admin-topbar__user" id="topbar-user">Admin</div>
      <button type="button" class="admin-theme-btn theme-toggle-btn" title="Switch to Light Mode">
        <span class="material-symbols-outlined theme-icon">light_mode</span>
      </button>
    </div>
  </header>

  <main class="admin-main" id="admin-main">

    <div class="admin-page-header">
      <h1 class="admin-page-title">Health Advice Management</h1>
      <button class="admin-btn admin-btn--primary" id="add-advice-btn">
        <span class="material-symbols-outlined">add</span> New Article
      </button>
    </div>

    <!-- Search & Filter -->
    <div class="admin-toolbar">
      <div class="admin-search-wrap">
        <span class="material-symbols-outlined admin-search-icon">search</span>
        <input type="text" id="advice-search" class="admin-search" placeholder="Search articles…" />
      </div>
      <select id="advice-category-filter" class="admin-select">
        <option value="">All Categories</option>
        <option value="nutrition">Nutrition</option>
        <option value="exercise">Exercise</option>
        <option value="mental_health">Mental Health</option>
        <option value="sleep">Sleep</option>
        <option value="general">General</option>
      </select>
    </div>

    <!-- Advice Cards -->
    <div class="admin-advice-grid" id="advice-grid">
      <div class="admin-table__empty">Loading advice…</div>
    </div>

    <!-- Add / Edit Advice Modal -->
    <div class="admin-modal-overlay" id="advice-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="advice-modal-title">
      <div class="admin-modal admin-modal--wide">
        <div class="admin-modal__header">
          <h2 class="admin-modal__title" id="advice-modal-title">New Health Article</h2>
          <button class="admin-modal__close" id="close-advice-modal" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <form id="advice-form" class="admin-form" novalidate>
          <input type="hidden" id="advice-id" />
          <div class="admin-form__grid">
            <div class="admin-form__group admin-form__group--full">
              <label for="advice-title">Title *</label>
              <input type="text" id="advice-title" class="admin-input" required placeholder="Article title…" />
            </div>
            <div class="admin-form__group">
              <label for="advice-category">Category</label>
              <select id="advice-category" class="admin-select">
                <option value="">— Uncategorized —</option>
                <option value="nutrition">Nutrition</option>
                <option value="exercise">Exercise</option>
                <option value="mental_health">Mental Health</option>
                <option value="sleep">Sleep</option>
                <option value="general">General</option>
              </select>
            </div>
            <div class="admin-form__group admin-form__group--full">
              <label for="advice-content">Content *</label>
              <textarea id="advice-content" class="admin-input admin-textarea" rows="8" required placeholder="Write detailed health advice here…"></textarea>
            </div>
          </div>
          <div id="advice-form-error" class="admin-form__error" style="display:none"></div>
          <div class="admin-form__actions">
            <button type="button" class="admin-btn admin-btn--ghost" id="cancel-advice">Cancel</button>
            <button type="submit" class="admin-btn admin-btn--primary" id="save-advice-btn">
              <span class="material-symbols-outlined">save</span> Save Article
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="admin-loading-overlay" id="page-loading" style="display:none">
      <div class="admin-spinner"></div>
    </div>
    <div class="admin-toast" id="admin-toast"></div>
  </main>

  <script src="../../assest/js/auth-backend-config.js"></script>
  <script src="../../assest/js/api-client.js"></script>
  <script src="../../assest/js/auth.js"></script>
  <script src="../../assest/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      AdminPanel.init('advice');
      AdminPanel.loadAdvice();
    });
  </script>
</body>
</html>
